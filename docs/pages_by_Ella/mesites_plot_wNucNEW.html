const y2Min = -zeroFrac * y2Max / (1 - zeroFrac);

const layout = {
  xaxis: {
    title: { text: "Genomic position" },
    range: [207321900, 207322500],
    tickformat: "d"
  },
  yaxis: {
    title: { text: "delMC" },
    range: [yMin, yMax],
    zeroline: false
  },
  yaxis2: {
    title: { text: "DANPOS peak coverage" },
    overlaying: "y",
    side: "right",
    showgrid: false,
    range: [y2Min, y2Max]
  },
  legend: {
    title: { text: "Genotype" }
  },
  margin: { t: 20, r: 60, b: 55, l: 60 },
  hovermode: "closest",
  shapes: [{
    type: "line",
    xref: "paper", x0: 0, x1: 1,
    yref: "y", y0: 0, y1: 0,
    line: { color: "#cccccc", width: 1 }
  }]
};

const config = {
  scrollZoom: true,
  displaylogo: false,
  responsive: true,
  modeBarButtonsToAdd: ["v1hovermode"]
};

Plotly.newPlot("plot", traces, layout, config);
